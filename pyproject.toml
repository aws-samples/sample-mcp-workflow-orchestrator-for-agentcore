[project]
name = "aws-mcp-workflow-orchestrator"
version = "0.1.0"
description = "Open, explainable reference pattern for orchestrating AWS MCP servers on AgentCore"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT-0" }
authors = [{ name = "Manish Roy" }]
dependencies = [
    "pyyaml==6.0.3",
    "pydantic==2.12.0",
    "mcp==1.28.1",
    "boto3==1.42.26",
    "rich==14.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.17.1"]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Keep ruff's defaults (E4/E7/E9, F) and add import sorting (I)
# and blind-except detection (BLE) so local runs match CI.
extend-select = ["I", "BLE"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
